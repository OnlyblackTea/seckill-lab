# ticket.yaml —— Stage 2 工单的**机器可读权威契约**。
#
# 契约来源（不是本仓自创的格式）：
#   schema : bagu-trainer/content/schema/ticket.schema.json（设计 §4.3）
#   模型   : bagu-trainer/platform_service/models.py::TicketSpec
#   准入门 : bagu-trainer/platform_service/admission.py::validate_track
#            （硬门会校验：schema 合法、scope.files_to_change 在骨架里真的存在、
#              submission.bagu_map_ref 的锚点在 bagu_map 里能解析、
#              D1 —— mentor_policy.may_write 绝不与 scope.files_to_change 相交）
#
# 八个 concern 各管一件事，互不串味：identity(身份+版本锚点) / brief(题面) / scope(改动面) /
# grader(红绿判据) / hints(阶梯提示) / submission(提交即答辩) / mentor_policy(导师权限) /
# progression(解锁依赖)。平台的 AI 经理**只拿这份文件**发卷，所以 brief.problem 必须自足。
#
# 学习者读的叙述版（线上问题的故事、「关键思考」四问）在
#   TASKS/stage-02-order-transaction.md
# 两者冲突时**以本文件为准**；本文件改了判据/题面要 bump identity.ticket_version（旧 Instance 失效，§9.2）。
#
# 写作规范（2026-09-27 起）：题面与判据按平台仓 `bagu-trainer/docs/工单写作规范.md` 的"叙事优先"重写——
# 自然段承载叙事、标题承载语义层级、列表只表达真正的并列，hints 每条带 title。
# 同时**按骨架与 canonical 测试的现状校正了事实**：本 ticket 此前描述的是重构前的骨架
# （"XML 未绑定 + seckill() 未实现"），而骨架早在那轮"让每个 stage 红在正确的地方"的改动里
# 就把 insertOrder / countByProduct 绑好、把 placeOrder 写通了；Stage 2 真正的红是**回滚**没发生。
# 实测形状见 TASKS/evidence-stages-02-06/REPORT.md（骨架 1 failure；参考解 3/3 绿）。

# ── identity：身份 + 版本锚点（发卷时钉进 TicketInstance，回答「这 PR 基于哪个版本」，§9.1）──
identity:
  id: db-stage-02
  schema_version: 1                 # ticket.yaml 结构版本（schema 演进用）
  ticket_version: 2                 # 本工单内容版本；改题面/判据 → bump → 旧 Instance 变 stale
  stage: 2
  title: 下单事务要原子

# ── brief：题面（自足，AI 经理据此发卷）──
brief:
  problem: |
    ## 问题背景

    【线上问题｜来自：交易组 · 优先级 P0】运营和客服一起找上来：秒杀**下单偶尔丢数据**。
    用户明明抢到了，`product.stock` 也确实少了 1，可 `seckill_order` 里查不到这张订单；
    偶尔又反过来——订单建出来了，库存却没动。财务月底对账直接对不上，差了几百单。

    根因不在业务逻辑，而在**事务边界**：骨架的下单链路把「扣库存」和「写订单」拆成两个各自
    自动提交的数据访问动作，中间没有任何东西把它们绑在一起。第一步成功、第二步失败时，谁也
    不会替你把第一步撤回来——这就是 ACID 里 A（Atomicity）在代码上的落点。请你把它改成
    一个原子操作。

    ## 你需要完成的修改

    改动面是两个文件（`scope.files_to_change`），但**这道题的活只有一个**：

    `src/main/java/com/devteam/seckill/service/SeckillService.java` —— 这是你要改的文件。
    `seckill(userId, productId)` 现在会走 `placeOrder(...)`，而 `placeOrder` 依次做了三件事：
    读商品与库存、扣库存（`updateStock(productId, stock - 1)`）、调 `OrderMapper.insertOrder(...)`
    写订单。三步都**没有事务**包裹，各自 autocommit。你要做的就是把「扣库存 + 建订单」收进
    **同一个事务**，用 Spring 的 `@Transactional`，并想清楚**哪些异常会触发回滚、哪些不会**。

    事务边界要打在 **service 层**：这是项目规范，理由在 `docs/架构与约定.md` 第 1 节——
    放 controller 会把 HTTP 处理时间算进事务、拉长持锁时间；放 mapper 又太细，盖不住「多步操作」。
    方法必须是 public，而且只能由**外部**调用它：同类内部自调用不走代理，事务会静默失效。

    写事务的时候请顺手确认两件与判据相关的事。其一，扣库存要看**受影响行数**：本项目里
    `product.stock` 必须 `stock > 0` 才扣，形状是
    `UPDATE product SET stock = stock - 1 WHERE id = #{id} AND stock > 0`，受影响行数大于 0 才算
    扣到，等于 0 说明已经售罄，此时返回售罄结果（`SeckillResult.soldOut(productId)`）。
    其二，`seckill_order` 上有唯一键 `uk_user_product (user_id, product_id)`，所以同一用户对同一
    商品重复下单时 `INSERT` 会被 MySQL 拒绝（错误码 1062，Spring 翻译成 `DuplicateKeyException`，
    它继承自 `DataIntegrityViolationException`，属于**未受检异常**）。

    顺序是**必须先扣库存、再插订单**，这一点不是风格偏好：如果调过来，重复下单会在插单那一刻就
    撞上唯一键，库存那一步根本还没执行——第二个用例就验了个空气，而不是验回滚。

    `src/main/resources/mapper/OrderMapper.xml` 在改动面里，但它**骨架里已经绑定好了**：
    `insertOrder` 配了 `useGeneratedKeys="true" keyProperty="id"`（自增主键回填到入参对象上，
    所以 `result.orderId()` 非空）、`countByProduct` 也已实现。把它留在改动面是为了给你一个
    可以照着写的样式（参数一律 `#{}`、禁止 `${}`）；这道题不需要改它，改了也不算越界。

    【骨架约定（决定了你怎么调）】扣库存那条 UPDATE 通过骨架已提供的数据访问入口执行
    （`ProductMapper.updateStock`，或注入 `JdbcTemplate`），订单写入走 `OrderMapper`——两者只要
    在同一个 `@Transactional` 里，就共享同一个连接、同一个事务。另外不要为了少写一条 XML 语句
    就在 Java 里拼 SQL：项目规范是**手写 SQL 全部落在 mapper XML**（`docs/架构与约定.md` 第 4 节）。
  # 注：列表里的 '@Transactional' 必须加引号——YAML 里裸的 '@' 是保留指示符，解析会直接报错。
  concepts: ["ACID", "事务边界", "@Transactional", "回滚规则", "传播行为", "事务失效"]

# ── scope：限定改动面（驱动评审与越界检测，§7.3）。D1：AI 导师绝不写这两个文件 ──
scope:
  files_to_change:
    - src/main/resources/mapper/OrderMapper.xml
    - src/main/java/com/devteam/seckill/service/SeckillService.java

# ── grader：客观红绿判据，在学员设备上本地跑；其结果按「不可信证据」处理（§7.4）──
grader:
  correctness:
    test_group: stage02              # 运行：mvn test -Dgroups=stage02
    test_version: 1                  # canonical 测试版本；与 ticket_version 一起钉进 Instance
    canonical_test: src/test/java/com/devteam/seckill/stage02/SeckillTransactionAcceptanceTest.java
    expect: |-
      初始为【红】，而且**只红在回滚这一件事上**：三个用例里
      `rollback_onOrderInsertFailure_restoresStock` 失败——先给某个用户在同一商品上预置一条订单
      （制造唯一键冲突），再让他下一单，INSERT 必然失败；可是此刻库存已经在前面被扣掉并且提交了，
      于是断言「建订单失败后库存必须回到原值」不成立。另外两个用例（正常下单、售罄不扣成负数）
      在骨架上本来就是绿的：骨架功能上是通的，缺的只是原子性。这就是「红在对的地方」——
      红在业务缺陷，不是编译错、不是脚本为空、不是装配失败（实测见
      TASKS/evidence-stages-02-06/REPORT.md）。

      改对后为【绿】，三个用例都过。正常下单时，库存从 5 减到 4、返回的剩余库存与库里一致、
      `countByProduct(productId)` 恰好是 1，而且返回的订单 id 非空、按它能查到订单（`insertOrder`
      的 `useGeneratedKeys` 生效）。售罄场景里，卖完最后一件之后库存停在 0、再下一单返回失败且
      没有订单 id、也不会被判成「重复下单」，订单数恰好等于初始库存。

      核心用例要的是这件事：重复下单失败之后，**商品库存必须与失败前完全相同**，
      `countByProduct` 也不增加。换句话说，它验的不是「异常能不能抛出来」，而是异常发生之后
      整个事务能不能保持一致——没有回滚，就会留下「库存扣了但订单没建」的经典丢单。
  performance: null                  # Stage 2 不判性能：本工单只谈事务正确性（索引/EXPLAIN 是 Stage 1 的判据）
  concurrency: null                  # Stage 3+ 才有（零超卖 sim，§7.5）

# ── hints：阶梯式提示，默认折叠（标题是「提示 N：title」）；展开一条会计入学习者画像（§10）──
hints:
  - id: H1
    title: 事务边界
    text: "`@Transactional` 应该打在哪个方法上？本题是 `SeckillService.seckill(Long, Long)`——方法必须是 public，而且只能由**外部**调用它（同类内部自调用不走代理，事务会静默失效）。再想一层：把它挪到 controller 层或 mapper 层分别要付出什么代价？"
  - id: H2
    title: 回滚规则
    text: "「异常时回滚」不是自动成立的：Spring 默认只对 RuntimeException / Error 回滚，受检异常抛出去**不会**回滚。把 API 文档里 `@Transactional` 的 rollbackFor 默认值查清楚，再看你这条链路上会抛什么——重复下单撞唯一键抛出的 `DuplicateKeyException` / `DataIntegrityViolationException` 属于哪一类？"
  - id: H3
    title: 怎么验证回滚
    text: |-
      想亲眼看见「异常之后库存到底回没回滚」？改代码前后各跑一次下面的对照（把 PRODUCT_ID / USER_ID 换成你的 fixture）：

        docker compose -f docker/docker-compose.yml exec mysql mysql -uroot -pbagu1234 seckill_lab \
          -e "SELECT id, stock FROM product WHERE id=PRODUCT_ID;
              SELECT COUNT(*) AS orders FROM seckill_order WHERE product_id=PRODUCT_ID;"

      在两次下单之间手动插一条同 (user_id, product_id) 的订单，就能制造出唯一键冲突；观察冲突之后 stock 有没有停在半路。
  - id: H4
    title: 再想一层
    text: "为什么「先扣库存、再插订单」这个顺序不能反过来？因为顺序一变，重复下单会在插单那一刻就炸，库存那一步还没执行——这条用例就再也验不到回滚了。再往深想：哪些写法会让 `@Transactional` 静默失效？（自调用、异常被 catch 吞掉、方法不是 public、多线程……）提示：它是**代理**在起作用，想清楚代理被绕过的情形。"

# ── submission：提交即答辩（§11.1 承继 seckill-lab 的「做完之后三件套」）──
submission:
  template:
    require:
      - 改后的 seckill() / placeOrder() 实现（事务边界在哪一行、为什么在那）
      - 一句话解释事务边界为什么放在 service 层，并说清哪些异常会触发回滚、哪些不会
      - 证明回滚的实测证据：重复下单失败前后，同一商品的 stock 与订单数对比
  # 锚点由 admission._github_anchor 实算：lowercase → 只保留「字母/数字/空格/-/_」（丢弃 · 与 & 与 emoji）
  #   → 空格替换成 '-'（空格不折叠，所以每个空格各留一个连字符）。
  # 本 Stage 的标题原文（docs/数据库八股地图.md 第 35 行）：
  #   "## Stage 2 · 事务 ACID & 传播 ⬜"
  # 逐步演算：去掉 '·' 与末尾 '⬜' → "stage 2  事务 acid  传播 " →
  #   'Stage'与'2'之间的空格 → '-'，'·' 被丢弃后两侧各留一个空格 → '--'，
  #   'ACID' 与 '&' 之间的空格保留，'&' 被丢弃 → '--'，末尾 emoji 前的空格 → 尾部一个 '-'。
  # 结果 = stage-2--事务-acid--传播-  （与 Stage 1 的 #stage-1--索引--执行计划- 同一算法，已复算校验）
  # 手写必错：**改标题就要重算**，改完锚点先跑 paper validate-track 的 bagu_map_anchor 门。
  bagu_map_ref: "docs/数据库八股地图.md#stage-2--事务-acid--传播-"

# ── mentor_policy：导师权限（§6.4）。D1 角色反转的硬约束 ──
mentor_policy:
  mode: mentor_then_reveal           # 陪练期只给思路不代写；**过关后**才对照 solutions 分支的参考解（§8）
  may_write: []                      # 导师在本仓无可写文件；绝不碰 scope.files_to_change（D1，准入门硬卡）

# ── progression：解锁依赖（v0.3 反转——声明「我依赖谁」而非「我解锁谁」，整体构成 DAG，§9.2）──
progression:
  # 依赖 Stage 1（商品查询与索引）：它是本 track 的 DAG 根节点，发卷即 available。
  # 声明顺序即教学顺序——事务要先于 Stage 3 的锁与超卖讲（§9.2）。
  prerequisites:
    - db-stage-01
