# ticket.yaml —— Stage 4 工单的**机器可读权威契约**。
#
# 契约来源（不是本仓自创的格式）：
#   schema : bagu-trainer/content/schema/ticket.schema.json（设计 §4.3）
#   模型   : bagu-trainer/platform_service/models.py::TicketSpec
#   准入门 : bagu-trainer/platform_service/admission.py::validate_track
#            （硬门会校验：schema 合法、scope.files_to_change 在骨架里真的存在、
#              submission.bagu_map_ref 的锚点在 bagu_map 里能解析、
#              D1 —— mentor_policy.may_write 绝不与 scope.files_to_change 相交）
#
# 八个 concern 各管一件事，互不串味：identity(身份+版本锚点) / brief(题面) / scope(改动面) /
# grader(红绿判据) / hints(阶梯提示) / submission(提交即答辩) / mentor_policy(导师权限) /
# progression(解锁依赖)。平台的 AI 经理**只拿这份文件**发卷，所以 brief.problem 必须自足。
#
# 学习者读的叙述版（线上问题的故事、「关键思考」五问）在
#   TASKS/stage-04-isolation-and-mvcc.md
# 两者冲突时**以本文件为准**；本文件改了判据/题面要 bump identity.ticket_version（旧 Instance 失效，§9.2）。

# ── identity：身份 + 版本锚点（发卷时钉进 TicketInstance，回答「这 PR 基于哪个版本」，§9.1）──
identity:
  id: db-stage-04
  schema_version: 1                 # ticket.yaml 结构版本（schema 演进用）
  ticket_version: 1                 # 本工单内容版本；改题面/判据 → bump → 旧 Instance 变 stale
  stage: 4
  title: 对账读到脏数据/不一致

# ── brief：题面（自足，AI 经理据此发卷）──
brief:
  problem: |
    【线上问题｜来自：数据组 · 优先级 P1】
    对账/统计报表（「某商品成交额多少、订单数多少」）在**并发下读到脏数据**：同一个统计事务里
    前后两次读到的值对不上，或读到别的会话**尚未提交**的中间态（订单已经插入、库存还没扣完），
    报表数字来回跳、口径对不上。请你说清楚这是哪种隔离问题，并把「对账口径」落到一张能持久化的表上。

    这不是编的——本骨架的 seckill_order（订单）与 product.stock（库存）在并发写入时没有任何统一口径，
    统计 SQL 在 InnoDB 默认 REPEATABLE READ 下走的是 MVCC 快照读，所以"同一事务两次读一致"
    与"跨事务能看到新提交"会同时出现，而"扣库存成功后又读到旧库存"正是快照读 vs 当前读的错位。

    【你要做什么｜正好改两个文件（就是 scope.files_to_change 那两个）】
    1) src/main/resources/mapper/OrderMapper.xml
       补全两条汇总 SQL（接口方法签名已给定，你只写 XML；<select id> 必须与方法名逐字一致）：
         * sumAmountByProduct —— 按商品汇总成交额。入参 productId，返回单值金额，
           resultType 用 java.math.BigDecimal（金额是 DECIMAL，别用 Double）。
         * countByProduct     —— 按商品统计订单数。入参 productId，返回单值行数，
           resultType 用 java.lang.Integer（或 int）。
       语义：SQL 形状是「SUM(amount) / COUNT(*) + WHERE product_id = #{productId}」这种单值聚合
       （入参只有一个 productId，不需要 GROUP BY）。参数一律用 #{}。
       ⚠️ 这两条会被验收测试在"两个独立 JDBC 连接 + 手工开关事务"的场景下调用，
       所以必须能在任意连接/事务里独立执行，不要依赖会话变量、临时表或先前的写操作。
       ⚠️ SUM(amount) 在没有任何匹配行时返回 NULL——想清楚你的 SQL 要不要 COALESCE 兜底，
       以及测试断言读到 null 会不会变成 NPE。
    2) src/main/resources/db/migration/V2__stage04_order_stat.sql
       现在整个脚本只有注释 + 末尾一条 SELECT 1; 占位（那条占位是防 Spring @Sql 因
       "整份脚本全是注释 = 空脚本"报 'script' must not be null or empty），不建任何表。
       把它补成【幂等建表】脚本，建出对账口径的持久化落点 order_stat。
       表结构必须与下面这段**一字不差**（列名/类型/默认值/索引名；canonical 测试据此核对）：
         CREATE TABLE IF NOT EXISTS order_stat (
           id         BIGINT        NOT NULL AUTO_INCREMENT,
           product_id BIGINT        NOT NULL,
           order_count INT          NOT NULL DEFAULT 0,
           amount_sum DECIMAL(12,2) NOT NULL DEFAULT 0,
           updated_at DATETIME      NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
           PRIMARY KEY (id),
           UNIQUE KEY uk_product (product_id)
         ) ENGINE = InnoDB DEFAULT CHARSET = utf8mb4;
       幂等写法：CREATE TABLE IF NOT EXISTS —— 脚本会被 @Sql 在【每个测试方法前】执行一次，
       重复执行不能报错、也不能丢已有数据。末尾那条 SELECT 1; 保留着（无害）。
  concepts: [隔离级别, MVCC, ReadView, "快照读 vs 当前读", 不可重复读, 幻读]

# ── scope：限定改动面（驱动评审与越界检测，§7.3）。D1：AI 导师绝不写这两个文件 ──
scope:
  files_to_change:
    - src/main/resources/mapper/OrderMapper.xml
    - src/main/resources/db/migration/V2__stage04_order_stat.sql

# ── grader：客观红绿判据，在学员设备上本地跑；其结果按「不可信证据」处理（§7.4）──
grader:
  correctness:
    test_group: stage04              # 运行：mvn test -Dgroups=stage04
    test_version: 1                  # canonical 测试版本；与 ticket_version 一起钉进 Instance
    canonical_test: src/test/java/com/devteam/seckill/stage04/IsolationLevelAcceptanceTest.java
    expect: |-
      canonical 测试自己用两个独立 JDBC 连接手工开关事务，并用 selectStock / countByProduct /
      sumAmountByProduct 观察可见性。初始为【红】，且必须红在这两个原因上：
        ① V2__stage04_order_stat.sql 还没建 order_stat 表 → 表不存在
           （BadSqlGrammarException: Table 'seckill_lab.order_stat' doesn't exist）→ 表/幂等用例失败；
        ② OrderMapper.xml 里 sumAmountByProduct / countByProduct 未绑定（<select> 缺失）→
           BindingException: Invalid bound statement (not found) → 汇总用例失败。
      改对后为【绿】，四条判据：
        ① 表存在且脚本幂等：V2 建出 order_stat（列定义与 uk_product 与 brief 一致）；
           脚本重复执行不报错、已有行不丢。
        ② 未提交不可见：会话 A 写入（插入订单 / 改库存）但未提交时，会话 B 在默认
           REPEATABLE READ 下读不到——countByProduct / sumAmountByProduct / selectStock
           仍返回提交前的旧值。
        ③ 同一会话内两次快照读结果一致：B 在同一事务里先后读两次（中间 A 提交了新写入），
           两次结果相同（RR 的 ReadView 在第一次快照读时生成、整个事务复用）。
        ④ 汇总 SQL 能看到已提交的最新值：A 提交后，B 另起新事务再读，
           countByProduct / sumAmountByProduct 反映最新已提交数据。
      注：迁移脚本若被改成「整份全是注释」，@Sql 会在 beforeTestMethod 阶段抛
      'script' must not be null or empty —— 那是红在**错误的地方**，不算数
      （骨架末尾的 SELECT 1; 就是为此留的，补建表语句时保留它）。
  performance: null                  # Stage 4 考的是可见性语义，不看执行计划（EXPLAIN 是 Stage 1）
  concurrency: null                  # 并发压测/零超卖是 Stage 3 的 sim 组；本工单不做

# ── hints：阶梯式提示，默认折叠；展开一条会计入学习者画像（§10）。都不给可直接抄的完整代码 ──
hints:
  - id: H1
    text: "V2__stage04_order_stat.sql 会被 @Sql 在每次测试方法前自动执行，所以你不用手动去数据库建表——把建表语句写进脚本就行。幂等靠 CREATE TABLE IF NOT EXISTS；骨架末尾那条 SELECT 1; 占位保留着别删（它是防 @Sql 把「整份全是注释」判成空脚本报 'script' must not be null or empty）。表名/列名/类型/uk_product 必须与 brief.problem 里那段一字不差，写错一个字 canonical 测试就红。"
  - id: H2
    text: "两条汇总 SQL 的形状都是「按商品过滤 + 一行聚合」，入参只有 productId，不需要 GROUP BY：sumAmountByProduct 用 SUM(amount)，countByProduct 用 COUNT(*)，条件都是 WHERE product_id = #{productId}。金额用 resultType=java.math.BigDecimal（别用 Double，DECIMAL 会精度失真），计数用 java.lang.Integer。另外想一下：没有任何匹配行时 SUM 返回 NULL，你的 SQL 要不要 COALESCE 到 0，以及断言读到 null 会不会 NPE。"
  - id: H3
    text: |-
      想手动复现隔离级别行为？开两个终端，各起一个交互式客户端：
        docker compose -f docker/docker-compose.yml exec mysql mysql -uroot -pbagu1234 seckill_lab
      然后（会话 A）：
        SELECT @@transaction_isolation;                     -- 应是 REPEATABLE READ
        SET SESSION TRANSACTION ISOLATION LEVEL REPEATABLE READ;   -- 想对比就改成 READ COMMITTED / READ UNCOMMITTED
        START TRANSACTION;
        SELECT COUNT(*) FROM seckill_order WHERE product_id = 10;
        -- 现在切到会话 B：INSERT 一行订单（先别提交），回到 A 重跑上面那条 SELECT → 看它读不读得到；
        -- 再切回 B COMMIT，然后回到 A 重跑同一条 SELECT → 看 A 的事务里值变不变；
        COMMIT;                                             -- A 提交后新开事务再读，就该看到 B 的提交结果了
      把两个会话「谁在什么时候 BEGIN / INSERT / COMMIT、各自读到什么」按时间线记下来，这就是答辩证据。
  - id: H4
    text: "MVCC / ReadView：InnoDB 每行有隐藏的 trx_id（最后一次改它的版本号）和 roll_pointer（指向 undo log 版本链）。普通 SELECT 是**快照读**——按 ReadView 的可见性规则沿版本链找「我能看见的那个版本」，不加锁；UPDATE / DELETE / SELECT ... FOR UPDATE 是**当前读**——读最新已提交版本并加锁。ReadView 的生成时机是 RR 与 RC 的分水岭：RR 在事务内第一次快照读时生成、之后整个事务复用同一个 ReadView，所以同一事务两次读结果一致（可重复读）；RC 每次 SELECT 都重新生成，所以每次都能看到别的事务新提交的数据（不可重复读）。所以「同事务两次读一致」与「跨事务能看到新提交」并不矛盾：前者是同一个 ReadView 的作用域，后者是新事务新 ReadView 的结果。线上 bug 的经典形状：扣库存的 UPDATE ... WHERE stock > 0 是当前读，同事务里随后那句普通 SELECT 是快照读——若 ReadView 在 UPDATE 之前就生成，SELECT 会读回扣减前的旧库存，看起来就是「扣成功了但库存没变」。要在同一事务里核对刚写下去的值，就用当前读（SELECT ... FOR UPDATE）或另起新事务读。至于 FOR UPDATE 的锁与间隙锁细节，是 Stage 6 的话题。"

# ── submission：提交即答辩（§11.1 承继 seckill-lab 的「做完之后三件套」）──
submission:
  template:
    require:
      - 改后的两条汇总 SQL（sumAmountByProduct / countByProduct）+ 幂等建表脚本（order_stat）
      - 一句话讲清你观察到的隔离级别行为（未提交不可见 / 快照一致 / 当前读看最新）
      - 实测证据：两次会话的时间线（谁在什么时候 START TRANSACTION / INSERT / COMMIT）与查询结果对比
  # 锚点由 admission._github_anchor 实算。本章标题原文（docs/数据库八股地图.md 第 67 行）：
  #   ## Stage 4 · 隔离级别 & MVCC ⬜
  # 算法照抄 Stage 1 的实例：去 · 与 &（两侧空格保留）+ 去结尾 emoji ⬜ + 整体小写 + 空格转 '-'
  #   → "stage-4--隔离级别--mvcc-"
  # （& 被丢弃后留双横线；emoji 被丢弃后**尾部还留一个连字符**。手写必错，改标题就要重算。）
  bagu_map_ref: "docs/数据库八股地图.md#stage-4--隔离级别--mvcc-"

# ── mentor_policy：导师权限（§6.4）。D1 角色反转的硬约束 ──
mentor_policy:
  mode: mentor_then_reveal           # 陪练期只给思路不代写；**过关后**才对照 solutions 分支的参考解（§8）
  may_write: []                      # 导师在本仓无可写文件；绝不碰 scope.files_to_change（D1，准入门硬卡）

# ── progression：解锁依赖（v0.3 反转——声明「我依赖谁」而非「我解锁谁」，整体构成 DAG，§9.2）──
progression:
  # 依赖 Stage 3（锁 & 超卖，db-stage-03）：先学会"扣库存 + 防超卖"，再回头看
  # "为什么扣成功了却能读到旧库存"——隔离级别与 MVCC 正是解释锁现象的钥匙。
  prerequisites: ["db-stage-03"]
