# ticket.yaml —— Stage 5 工单的**机器可读权威契约**。
#
# 契约来源（不是本仓自创的格式）：
#   schema : bagu-trainer/content/schema/ticket.schema.json（设计 §4.3）
#   模型   : bagu-trainer/platform_service/models.py::TicketSpec
#   准入门 : bagu-trainer/platform_service/admission.py::validate_track
#            （硬门会校验：schema 合法、scope.files_to_change 在骨架里真的存在、
#              submission.bagu_map_ref 的锚点在 bagu_map 里能解析、
#              D1 —— mentor_policy.may_write 绝不与 scope.files_to_change 相交）
#
# 八个 concern 各管一件事，互不串味：identity(身份+版本锚点) / brief(题面) / scope(改动面) /
# grader(红绿判据) / hints(阶梯提示) / submission(PR 即答辩) / mentor_policy(导师权限) /
# progression(解锁依赖)。平台的 AI 经理**只拿这份文件**发卷，所以 brief.problem 必须自足。
#
# 学习者读的叙述版（线上问题的故事、「关键思考」六问、TTL 的取舍）在
#   TASKS/stage-05-cache-triad.md
# 两者冲突时**以本文件为准**；本文件改了判据/题面要 bump identity.ticket_version（旧 Instance 失效，§9.2）。
#
# 状态说明（勿删）：本 ticket 已定稿，但 Stage 5 的 canonical 测试**尚未放出**，
# 所以 grader.correctness.expect 的红/绿形状是**设计预期**而非 VM 实测（Stage 1 已实测，
# 见 TASKS/evidence-stage-01/REPORT.md）。测试落地后必须真机跑一次
# `mvn -B -Dgroups=stage05 test`（先红后绿），把实测数字回填进 expect，做法与 Stage 1 一致。
# 注意：Stage 5 要连**真 Redis**（宿主端口 16379 -> 容器 6379），跑之前先
# `docker compose -f docker/docker-compose.yml up -d`。

# ── identity：身份 + 版本锚点（发卷时钉进 TicketInstance，回答「这 PR 基于哪个版本」，§9.1）──
identity:
  id: db-stage-05
  schema_version: 1                 # ticket.yaml 结构版本（schema 演进用）
  ticket_version: 1                 # 本工单内容版本；改题面/判据 → bump → 旧 Instance 变 stale
  stage: 5
  title: 热点商品打挂 DB

# ── brief：题面（自足，AI 经理据此发卷）──
brief:
  problem: |
    【线上问题｜来自：秒杀组 · 优先级 P0】
    秒杀开场那一刻，值班同学看着监控直冒冷汗：**同一个热点商品**被几十万次查询砸到 MySQL 上，
    DB 连接池瞬间被打满（HikariCP 开始抛 Connection is not available, request timed out）、
    MySQL CPU 飙到 100%，紧接着商品详情、下单、支付回调**一起**超时。根因不是 SQL 写得差——
    是查询链路上没有缓存这一层：每次查询都直查 DB，热点商品被查多少次，product 表就被打多少次。
    请你引入 Redis 缓存，把这三件套——**穿透 / 击穿 / 雪崩**——分别挡住，并给出可复核的实测证据。

    这不是编的——本骨架有 Redis（容器 seckill_redis，宿主端口 16379 -> 容器 6379，见
    docker/docker-compose.yml；key 用 String 序列化、value 用 JSON 序列化，见
    config/RedisConfig.java），但商品查询链路上**没有人在用**。

    【你要做什么｜正好改两个文件（就是 scope.files_to_change 那两个）】
    1) src/main/java/com/devteam/seckill/service/ProductService.java
       实现带缓存的商品查询 `Product getProductCached(Long id)`（签名已在骨架里定好）。语义硬要求：
         * 先查 Redis（key 前缀 `product:`，冒号后拼商品 id；键名要能稳定复现，
           改完自己用 redis-cli 能看到它）。命中就直接返回，**不打 DB**。
         * 未命中才加载，并**写回缓存**；写入时必须带 **TTL**（秒级，建议基准 60–300 秒）。
         * **缓存穿透**：查询一个**不存在**的商品（DB 也查不到）时，必须把「空结果」
           也缓存起来（哨兵值 / 空对象，配一个**较短**的 TTL），这样第二次查同一个不存在的
           id 会直接命中这条空缓存，**不会再打 DB**——否则别人拿一串不存在的 id 反复请求，
           每次都穿透到 DB，这就是穿透。
         * `void evictProductCache(Long id)`：删掉该 id 的缓存（商品变更/下架后失效用；
           面试里这就是 Cache Aside 的「删缓存」那一步）。
    2) src/main/java/com/devteam/seckill/service/ProductCacheLoader.java
       它现在的 `load(Long id, Supplier<Product> fallback)` 是**不做任何并发协调的直查实现**：
       每次调用都先 increment 计数、再执行 fallback（真实打一次 DB），所以并发来了就并发打 DB。
       把它改成**单飞（single-flight）**：同一个 id 并发进来时**只允许一个线程**真正执行
       fallback（去查 DB），其余线程等它结束后**复用同一个结果**。手段自选（本地分段锁、
       Redis `SET NX PX` 互斥锁 + 双重检查，骨架里已备好一个 ConcurrentHashMap 分段锁字段供你取用）。
       硬要求：
         * 判据只有一个：**20 个并发线程查同一个不存在的 id，真实 DB 加载次数恰好 = 1**。
         * 因此计数必须留在「真正执行 fallback 的那一次」上——**等待复用的线程不许再 increment**。
         * **不存在的 id（fallback 返回 null）同样是一件要被复用的结果**：不能因为结果是 null
           就让每个线程各查一遍 DB，否则穿透与击穿会在这一处叠加。

    【骨架约定（不是你要改的文件，但决定了你怎么调）】
    * 骨架注入的是 config/RedisConfig.java 里那个 RedisTemplate<String, Object>
      （String key + JSON value），你可以直接用它读/写缓存与锁。
    * 「打了几次 DB」由 ProductCacheLoader 上的 `long loadCount()` / `void resetLoadCount()`
      如实统计（LongAdder）。验收测试就是用它断言「20 并发 → 加载次数恰好 = 1」。
      所以：**不要绕过加载器自己调 Mapper**，也别在命中缓存时去碰计数器，
      否则计数失去意义、判据随之失效。
    * TTL 的形态（固定值 / 基准值 + 随机抖动）由你决定并说明理由——雪崩那一问的答案在这里。
    * 不使用 Spring Cache 注解（@Cacheable 等）：本项目要你亲手写 key、TTL、空值缓存与
      互斥/单飞协调，注解会把这几件事全藏起来，面试也讲不出来。
  concepts: [缓存穿透, 缓存击穿, 缓存雪崩, 空值缓存, 单飞/互斥锁, TTL, 缓存一致性]

# ── scope：限定改动面（驱动评审与越界检测，§7.3）。D1：AI 导师绝不写这两个文件 ──
scope:
  files_to_change:
    - src/main/java/com/devteam/seckill/service/ProductCacheStore.java
    - src/main/java/com/devteam/seckill/service/ProductCacheLoader.java

# ── grader：客观红绿判据，在学员设备上本地跑；其结果按「不可信证据」处理（§7.4）──
grader:
  correctness:
    test_group: stage05              # 运行：mvn test -Dgroups=stage05
    test_version: 1                  # canonical 测试版本；与 ticket_version 一起钉进 Instance
    canonical_test: src/test/java/com/devteam/seckill/stage05/ProductCacheAcceptanceTest.java
    expect: |-
      初始为【红】，且必须红在这两处（设计预期，待真机实测回填具体计数）：
        ① 缓存读写不全（getProductCached 抛 UnsupportedOperationException，或未把 key/TTL/
           空值哨兵写回 Redis）→ 命中/空值/失效用例失败；
        ② ProductCacheLoader 是不做协调的直查实现 → 并发场景下 DB 加载次数 == 线程数
           （20 个线程就是 20 次加载）→ 防击穿用例失败。
      改对后为【绿】（四条判据，全过才算工单完成）：
        ① 首次查询打 DB 并写缓存：loadCount() 从 0 → 1，且 redis-cli 里能看到该 key；
           **紧接着第二次查同一个 id 命中缓存**，返回的商品字段与第一次一致，
           且 loadCount() **不再增长**（仍为 1）。
        ② 查一个**不存在**的 id：DB 查不到，但必须写入「空结果」缓存；
           第二次查同一个不存在的 id **不再打 DB**（loadCount 不增长），返回空（null）。
           把「空」也当成一种要缓存的状态，才是穿透被挡住了。
        ③ 防击穿（本工单核心）：resetLoadCount() 之后，N=20 个线程**同时**查询同一个
           不存在的 id，全部返回后断言 loadCount() == 1——
           说明只有一个线程真的去重建，其余 19 个等待并复用了结果。
        ④ 缓存一致性：evictProductCache(id) 之后，下一次 getProductCached(id)
           **重新打 DB**（loadCount +1）并刷新缓存；再查一次又不打 DB。
      注：若 Redis 没起（宿主 16379 连不上）或连接不上真 MySQL，那是红在**错误的地方**
      （环境问题），不算「红在该红的地方」，先把 docker 基础设施拉起来再跑。
  performance: null
    # Stage 5 不判性能：本工单的指标是「并发下的 DB 加载次数」（见 concurrency 与 correctness ③），
    # EXPLAIN / 执行计划是 Stage 1 的判据，这里刻意留空。
  concurrency:
    # 这一条是真实判据而不是占位：防击穿的效果只能用「并发下 DB 被打了几次」来量。
    type: cache_stampede
    assert: "db_loads == 1 for N concurrent misses"
    # 口径：resetLoadCount() 之后，N 个线程同时查询**同一个尚未缓存的 id**（用不存在的 id
    # 能把穿透与击穿叠在一起考），全部返回后 loadCount() 必须恰好为 1。
    # 注意它是「恰好」而不是「不超过」：0 说明你压根没加载（数据是假的），
    # >1 说明单飞协调没生效（其余线程也去打 DB 了）。

# ── hints：阶梯式提示，默认折叠；展开一条会计入学习者画像（§10）──
hints:
  - id: H1
    text: "缓存 key 先定死：用 product: 做业务前缀，后面拼商品 id（冒号分隔，层次清楚、也方便按前缀批量排查）。然后想清楚**为什么必须写 TTL**——如果只 SET 不 EXPIRE，这条 key 就永久驻留：商品改了价、下了架，缓存还理直气壮地返回旧值，最后只能靠 evictProductCache 兜。TTL 是「缓存与 DB 之间允许的最大不一致窗口」，选值就是在这件事和缓存命中率之间做取舍。"
  - id: H2
    text: "空结果怎么缓存？value 走的是 RedisConfig 里的 JSON 序列化，所以「空」落到 Redis 里不是一个你能用肉眼直接读懂的自然值——先想清楚：你要存的是 JSON 的 null，还是一个像 \"NULL\" 这样的**哨兵字符串**？两者在反序列化回来时你怎么区分「没缓存」和「缓存了空」？想清楚再定 TTL 的长短：空结果的 TTL 该和真数据一样长吗？如果缓存了一个「其实已经上架」的商品为空、又迟迟不过期，会发生什么？（反问自己：这条空缓存的 TTL 是保护 DB 的，还是保护数据正确性的？）"
  - id: H3
    text: |-
      想手动看缓存到底写进去没有？注意：**容器内** Redis 监听的是默认端口 6379，
      而 docker-compose 把宿主机端口 16379 映射到它（application.yml 里 REDIS_PORT 的默认值
      也是 16379）。两条路随便挑一条，别把端口串了：
        # 方式 A：exec 进容器执行，容器内就是 6379（本仓最省事的一条）
        docker exec seckill_redis redis-cli KEYS 'product:*'
        docker exec seckill_redis redis-cli TTL product:999901
        docker exec seckill_redis redis-cli GET product:999901
        # 方式 B：宿主机上装了 redis-cli，走宿主映射端口 16379
        redis-cli -h localhost -p 16379 KEYS 'product:*'
        redis-cli -h localhost -p 16379 TTL product:999901
      要看的四件事：① 查过的商品有没有出现 key；② `TTL` 返回的是不是**正整数**
      （‑1 = 永不过期，说明你漏了 TTL；‑2 = key 不存在）；③ `GET` 出来的 JSON 里字段对不对；
      ④ 查一个**不存在**的 id 之后再 `KEYS` 一次——那条空缓存有没有出现？
      （如果你存的是 JSON null，`GET` 出来 redis-cli 可能显示 `(nil)`，和「key 根本不存在」
      长得一模一样——这正是 H2 说的那个坑，别被它骗了。）"
  - id: H4
    text: "三个词先分清，别背混：**穿透**是「查的东西根本不存在」（缓存和 DB 都没有，每次请求都穿过缓存打到 DB）；**击穿**是「某个热点 key 恰好过期的那一瞬间，大量并发同时去重建」（数据是存在的，只是重建那一刻没被协调）；**雪崩**是「大量 key 同时过期 / Redis 整体挂掉」（面积最大，不是单个 key）。防击穿的标准解法是给重建路径加**互斥/单飞**协调：要么在本地按 id 分段加锁（一个 id 一把锁，其余线程等它算完复用结果），要么用 Redis 的 SET key value NX PX ttl 抢一把跨进程的锁（NX = 没人持有才建，PX = 毫秒级自动过期，防止持锁线程崩了把锁永久占住），拿到锁的线程**再查一次缓存**（双重检查——大概率前一个持锁者已经建好了），仍然没有才去查 DB、写缓存、最后释放锁；没抢到锁的线程不查 DB，而是短暂等待/重试后回读缓存。两条路都要守住同一件事：**只有真正执行 DB 查询的那一次才计数**。防雪崩则是在 TTL 上做**随机抖动**：给基准 TTL 加一个随机偏移，让大量 key 的过期时刻散开，别叠在同一秒。最后顺着想一层：如果用 Redis 锁，为什么释放锁不能只 DELETE，而要先确认「这把锁确实是我加的」？（Stage 6 会用 Lua 把这件事做原子。）"
  # 提示纪律：这四条只给方向、命令与原理对比，**不给可直接抄的完整代码**——
  # 代码是要学员自己能讲出来的东西（D1）。

# ── submission：PR 即答辩（§11.1 承继 seckill-lab 的「做完之后三件套」）──
submission:
  template:
    require:
      - 改后的 ProductService / ProductCacheLoader 关键代码（缓存读写、空值缓存与 TTL、单飞/互斥协调、evictProductCache）
      - 一句话分别说明你怎么防住穿透、怎么防住击穿，以及你对雪崩做了什么（TTL 策略）
      - 实测证据：改动前后 loadCount() 的对比数字（尤其 20 并发查同一个不存在的 id 时的加载次数），以及 redis-cli 里看到的 key / TTL / 空值
  # 锚点由 admission._github_anchor 实算（platform_service/admission.py:263）：
  #   小写 → 只保留「字母/数字/空格/-/_」（丢弃 · 与 & 与 emoji）→ 空格替换成 '-'（空格不折叠）。
  # 本 Stage 的标题原文（docs/数据库八股地图.md 第 84 行）：
  #   "## Stage 5 · Redis 缓存三件套 ⬜"
  # 逐步演算：'Stage 5' 原样 → "stage 5"；'·' 被丢弃后两侧各留一个空格 → '--'；
  #   'Redis' 与 '缓存三件套' 之间只有一个空格（没有可丢弃的标点）→ 单个 '-'；
  #   末尾 '⬜' 被丢弃，其前面的空格 → 尾部一个 '-'。
  # 结果 = stage-5--redis-缓存三件套-  （与 Stage 1 的 #stage-1--索引--执行计划- 同一算法，已复算校验）
  # 手写必错：**改标题就要重算**，改完锚点先跑 paper validate-track 的 bagu_map_anchor 门。
  bagu_map_ref: "docs/数据库八股地图.md#stage-5--redis-缓存三件套-"

# ── mentor_policy：导师权限（§6.4）。D1 角色反转的硬约束 ──
mentor_policy:
  mode: mentor_then_reveal           # 陪练期只给思路不代写；**过关后**才对照 solutions 分支的参考解（§8）
  may_write: []                      # 导师在本仓无可写文件；绝不碰 scope.files_to_change（D1，准入门硬卡）

# ── progression：解锁依赖（v0.3 反转——声明「我依赖谁」而非「我解锁谁」，整体构成 DAG，§9.2）──
progression:
  # 依赖 Stage 4（隔离级别 & MVCC）：缓存这一层要建立在「DB 的可见性语义已经清楚」之上——
  # 否则你连「缓存里那个旧值到底算不算脏」都判不了。声明顺序即教学顺序（§9.2）。
  prerequisites:
    - db-stage-04
