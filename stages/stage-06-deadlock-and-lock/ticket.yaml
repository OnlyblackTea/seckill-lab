# ticket.yaml —— Stage 6 工单的**机器可读权威契约**（选修阶段）。
#
# 契约来源（不是本仓自创的格式）：
#   schema : bagu-trainer/content/schema/ticket.schema.json（设计 §4.3）
#   模型   : bagu-trainer/platform_service/models.py::TicketSpec
#   准入门 : bagu-trainer/platform_service/admission.py::validate_track
#            （硬门会校验：schema 合法、scope.files_to_change 在骨架里真的存在、
#              submission.bagu_map_ref 的锚点在 bagu_map 里能解析、
#              D1 —— mentor_policy.may_write 绝不与 scope.files_to_change 相交）
#
# 八个 concern 各管一件事，互不串味：identity(身份+版本锚点) / brief(题面) / scope(改动面) /
# grader(红绿判据) / hints(阶梯提示) / submission(提交即答辩) / mentor_policy(导师权限) /
# progression(解锁依赖)。平台的 AI 经理**只拿这份文件**发卷，所以 brief.problem 必须自足。
#
# 本阶段是**选修**：不做也不影响主线（prerequisites 依赖 db-stage-05，但解锁只是"可用"，
# 不是主线必经；main 主线走完 Stage 5 即告一段落）。
#
# 学习者读的叙述版（线上问题的故事、「关键思考」五问）在
#   TASKS/stage-06-deadlock-and-lock.md
# 两者冲突时**以本文件为准**；本文件改了判据/题面要 bump identity.ticket_version（旧 Instance 失效，§9.2）。

# ── identity：身份 + 版本锚点（发卷时钉进 TicketInstance，回答「这 PR 基于哪个版本」，§9.1）──
identity:
  id: db-stage-06
  schema_version: 1                 # ticket.yaml 结构版本（schema 演进用）
  ticket_version: 1                 # 本工单内容版本；改题面/判据 → bump → 旧 Instance 变 stale
  stage: 6
  title: 死锁与分布式锁（选修）

# ── brief：题面（自足，AI 经理据此发卷）──
brief:
  problem: |
    【线上问题｜来自：交易组 · 优先级 P1】（本阶段为**选修**，不做也不影响主线）
    工单箱里同时躺了两个人的报告，看起来无关，其实是同一个病根：
      ① DBA 告警：生产上偶发 `Deadlock found when trying to get lock; try restarting transaction`。
         两笔互不相干的秒杀单能把对方锁死——一笔回滚，用户看到「下单失败，请重试」。
      ② 运维告警：秒杀服务扩到**两个实例**之后，同一个用户抢同一件商品出现**重复扣减**；
         而本地单实例怎么压都复现不出来。
    组里的原话：「你们的锁只在自己那个 JVM 里有效，一到多实例就是摆设；
    而你们给同一个订单加锁的顺序，两个事务正好是反的。」
    请你把这两个问题一起修掉，并**用实测证据**证明锁真的跨实例互斥、且不会再死锁。

    这不是编的——本骨架的 SeckillService 把「扣库存（写 product）」与「建订单（写 seckill_order）」
    拆成两行、两步，中间没有任何「谁先谁后」的约定，两个并发事务以相反顺序碰这两行就构成循环等待；
    而 LockService 接口的三个方法在 LockServiceImpl 里现在全是 TODO（抛 UnsupportedOperationException），多实例部署时本地锁根本锁不住。

    【你要做什么｜正好改两个文件（就是 scope.files_to_change 那两个）】
    1) src/main/java/com/devteam/seckill/service/LockServiceImpl.java
       接口已定稿（骨架不改签名，**你只改实现**），三个方法：
         boolean tryLock(String key, String token, long ttlMillis);  // 非阻塞抢锁
         void    unlock(String key, String token);                   // 释放锁
         boolean isHeldBy(String key, String token);                 // 锁是否仍被该 token 持有
       现在是 TODO（抛 UnsupportedOperationException）。要求：
         a. 抢锁必须**原子**完成「不存在才写入 + 设置过期时间」，对应 Redis 的
            `SET key value NX PX ttl` 一条命令；抢不到返回 false（不阻塞）。
            实现里用 RedisConfig 已配好的 `RedisTemplate<String,Object>`（key 用 String 序列化、
            value 用 JSON 序列化，所以 token 字符串在 redis-cli 里是**带引号的 JSON 字符串**——
            比对 token 时以你代码里读回的对象为准，别假设是裸字符串）。
         b. **value 必须是唯一 token**（每次抢锁都不同，如 UUID），绝不能是固定字符串。
         c. 释放锁必须**校验 token 再删除**：只有锁里记录的 value 与传入 token 一致才删除，
            不一致说明锁已过期并被别人拿走，此时必须什么都不做（否则就是误删别人的锁）。
            「比对 + 删除」必须是**原子**的（Lua 脚本），否则 GET 与 DEL 之间锁可能已经易主。
         d. isHeldBy 用于测试与排查：判断锁当前是否仍由该 token 持有。
         e. （选修加分）在注释或实现里说明 TTL 到期与「看门狗 / 续期」的关系：
            业务耗时超过 TTL 会失去互斥保护，可用 `EXPIRE` 续期，代价是什么。
       锁 key 命名约定：`lock:seckill:{productId}`。

    2) src/main/java/com/devteam/seckill/service/SeckillService.java
       让秒杀下单路径**按固定顺序**获取两行相关的锁 / 更新，消除循环等待：
         - 要么在进入事务前按固定顺序抢分布式锁（key 形如 `lock:seckill:{productId}`，
           若一次下单要碰多个 product，则**按 productId 升序**依次 `tryLock`）；
         - 要么在事务里用 `SELECT ... FOR UPDATE` 时同样**按 id 升序**加锁；
         - 无论走哪条路，**全局必须只有一个顺序**（约定：先 product 后 order）。
       两条都行，但**顺序必须全网一致**——这正是「破坏循环等待」的全部含义。

    【验收｜两条命令】
    a. mvn test -Dgroups=stage06
       canonical 测试：src/test/java/com/devteam/seckill/stage06/DistributedLockAcceptanceTest.java
       **骨架【红】**：tryLock 抛 UnsupportedOperationException。
       **实现后【绿】**，五个用例：
         ① 互斥：同一个 key 第二次 tryLock 返回 false；
         ② 释放后可重抢：unlock 后另一个 token 能拿到；
         ③ TTL 到期自动释放：持锁后等 TTL 过，另一个 token 能拿到（这是「防死锁」的安全网）；
         ④ **误删防护**（本工单教学重点）：持有者 A 的锁过期后 B 拿到锁，
            此时 A 调 unlock(key, A的token) **绝不能**删掉 B 的锁——B 的 isHeldBy 仍须为 true；
            随后 B 自己调 unlock(key, B的token) 才能删掉。
         ⑤ 反向加锁顺序的并发下单：两个线程对（productId 较小, userId 较大）与
            （productId 较大, userId 较小）交叉下单，**全部成功**，
            且不得出现 DeadlockLoserDataAccessException / CannotAcquireLockException。
       （未修的顺序敏感实现会在 ⑤ 上抛
        org.springframework.dao.DeadlockLoserDataAccessException /
        CannotAcquireLockException 之类的死锁异常——那是**红在该红的地方**。）
    b. mvn test -Dgroups=sim -Dtest.excludedGroups=        （依赖 Stage 2/3 已完成）
       并发模拟器 src/test/java/com/devteam/seckill/sim/SeckillLoadSimulator.java 仍须零超卖：
       100 线程抢同一商品，成功下单数不得超过库存。修 ⑤ 的加锁顺序不能把 Stage 3 的零超卖弄丢。
  concepts: [死锁排查, 加锁顺序, 间隙锁, 分布式锁, 锁续期]

# ── scope：限定改动面（驱动评审与越界检测，§7.3）。D1：AI 导师绝不写这两个文件 ──
scope:
  files_to_change:
    - src/main/java/com/devteam/seckill/service/LockServiceImpl.java
    - src/main/java/com/devteam/seckill/service/SeckillService.java

# ── grader：客观红绿判据，在学员设备上本地跑；其结果按「不可信证据」处理（§7.4）──
grader:
  correctness:
    test_group: stage06              # 运行：mvn test -Dgroups=stage06
    test_version: 1                  # canonical 测试版本；与 ticket_version 一起钉进 Instance
    canonical_test: src/test/java/com/devteam/seckill/stage06/DistributedLockAcceptanceTest.java
    expect: |-
      初始为【红】，且必须红在该原因上（canonical 测试尚未放出，以下为**预期**形状）：
        - LockServiceImpl.tryLock / unlock / isHeldBy 全是 TODO，调用抛
          UnsupportedOperationException("...")；用例 ①~④ 在第一个断言前就炸在这里。
      改对后为【绿】（5 个用例）：
        ① 互斥：同 key 第二次 tryLock 返回 false；
        ② 释放后可重抢：unlock 后换一个 token 再 tryLock 返回 true；
        ③ TTL 到期自动释放：持锁后等 TTL 过去，另一个 token 能拿到（防死锁的安全网）；
        ④ 误删防护：A 的锁过期 → B 拿到 → A 调 unlock(key, A的token) 后 B 的 isHeldBy 仍为 true；
           只有 B 调 unlock(key, B的token) 才真正删掉；
        ⑤ 反向加锁顺序的并发下单全部成功，无 DeadlockLoserDataAccessException /
           CannotAcquireLockException。
      注：④ 与 ③ 要分开看——③ 证明「锁会自己过期」（防死锁），④ 证明「过期之后旧持有者
      回来不会误删新持有者的锁」（防误删）。只做前半截（SET NX PX 抢锁）而 unlock 里直接 DEL
      的实现，①②③⑤ 全绿、**只有 ④ 红**；这正是本工单刻意保留的判别点，别当成测试写错了。
  # 本工单不涉及索引/执行计划，没有可断言的 EXPLAIN 判据，故为 null
  # （性能面不空着：由下面 grader.concurrency 的死锁探针覆盖）。
  performance: null
  concurrency:
    # Stage 3 的 sim「零超卖」是**数量**断言；这里是**死锁探针**：断言「没有异常 + 全部成功」。
    type: deadlock_probe
    assert: "no deadlock exception; all attempts succeed"
    note: |-
      canonical 测试的第 ⑤ 个用例即死锁探针：两个线程对（productId 较小, userId 较大）与
      （productId 较大, userId 较小）交叉下单，全部成功且无死锁异常；未修加锁顺序的实现在此抛
      DeadlockLoserDataAccessException / CannotAcquireLockException。
      另有回归：mvn test -Dgroups=sim -Dtest.excludedGroups= 仍须零超卖（100 线程抢同一商品）。
      只在 Stage 2/3 已实现 seckill() 后才有意义（否则模拟器只会统计到 501 notImplemented）。

# ── hints：阶梯式提示，默认折叠；展开一条会计入学习者画像（§10）──
hints:
  - id: H1
    text: |-
      先想清楚为什么本地锁不够：synchronized / ReentrantLock 只在一个 JVM 内互斥，
      多实例部署时两个进程各自"以为自己是唯一持有者"。跨进程互斥必须落在一个共同的外部存储上。
      Redis 侧的正确起点是**一条命令**：SET key value NX PX ttl —— NX 保证"不存在才写入"，
      PX 顺手把过期时间设上。为什么不能拆成 SETNX + 再单独 EXPIRE？因为两条命令之间一旦
      进程崩溃 / 网络断开，第二句就永远发不出去，这把锁变成**永不过期**的死锁。
      value 为什么不能是固定字符串（如 "1"）？因为释放锁时要靠它回答"这锁到底是不是我的"——
      value 必须每次抢锁都不同（UUID 之类）。唯一 token 是后面所有正确性的地基。
  - id: H2
    text: |-
      释放锁为什么必须"先比对 token 再删"？因为"判断是不是我的"和"删除它"是两步，
      两步之间锁可能已经过期并被别人抢走——典型的 check-then-act 竞态：
        A 拿到锁(TTL 5s) → A 停顿 6s → 锁自动过期 → B 拿到锁 → A 醒来 DEL → 删掉了 B 的锁。
      结果：互斥被打破，B 以为自己独占却在裸奔。
      为什么只能用 Lua？因为你需要的原子性范围在 **Redis 服务端**，不是在 Java 进程里。
      你的 Java synchronized 只能拦住本 JVM 的线程，拦不住另一个实例、也拦不住"另一条连接"；
      而 Redis 执行 Lua 脚本时不会插入其他命令，所以"比对 + 删除"能真正原子完成。
      提示：比对的对象是锁里存的 value（token），不是 key。
  - id: H3
    text: |-
      想手动观察锁的行为？在宿主机上（compose 把 Redis 映射到 16379）：
        docker exec seckill_redis redis-cli -p 6379 SET lock:demo tok NX PX 5000   # 抢锁，返回 OK
        docker exec seckill_redis redis-cli -p 6379 SET lock:demo tok2 NX PX 5000  # 再抢，返回 (nil)
        docker exec seckill_redis redis-cli -p 6379 GET lock:demo                  # 看现在是哪个 token
        docker exec seckill_redis redis-cli -p 6379 TTL lock:demo                  # 看剩余毫秒
      等 5 秒后再 GET lock:demo → (nil)，再 SET ... NX 就能拿到 —— 这就是③「TTL 到期自动释放」。
      注意 GET 出来的字符串：RedisConfig 把 value 序列化成了 JSON，所以你会看到带引号的字符串；
      手动复现④「误删防护」时，顺序是：SET(A) → 等 TTL 过 → SET(B) → 用 A 的 token 去删
      （正确的实现：删不掉）→ GET 确认还是 B 的 value。
      这套命令就是你答辩第三件证据（前后对比）的来源。
  - id: H4
    text: |-
      死锁四条件：互斥、持有并等待、不可剥夺、**循环等待**。前三条在数据库里改不掉
      （锁本来就是互斥的、事务本来就要持有到提交），所以工程上最常用的一招是破坏**循环等待**：
      给所有事务要碰的资源定一个**全局全序**，每个事务都按这个顺序加锁。
      一旦顺序统一，等待关系就只可能指向同一个方向（小 id → 大 id），形不成环。
      落到本工单：约定"先 product 后 order"；如果需要锁多行，就按主键 **id 升序**依次加锁
      （SELECT ... FOR UPDATE 也照样要按 id 升序扫）。
      定位线上死锁：SHOW ENGINE INNODB STATUS\G，看 **LATEST DETECTED DEADLOCK** 那一段——
      它会给出两个事务各自的 id、正在执行的 SQL、**持有的锁**和**等待的锁**；
      把两边的"持有 → 等待"画出来，环就现形了。完整日志记得落盘（innodb_print_all_deadlocks=ON），
      否则下一次死锁发生时 LATEST 段可能已经被覆盖。
      顺带两件常被追问的事：(a) RR 隔离级别下的**间隙锁 / Next-Key Lock** 会锁住索引区间之间的
      空隙，配合插入意向锁（Insert Intention Lock），两个事务各插各的也可能互相等待——
      这就是"看着毫不相干的两条 INSERT 也能死锁"的原因，而唯一索引上的等值插入能显著缩小这个窗口；
      (b) 「业务没跑完锁先过期」= 两个实例同时自认为持锁，看门狗续期就是给"还在干活"的持有者
      不断 EXPIRE 把 TTL 续上，代价是多一个后台线程 + 续期本身也可能失败（续不上就该主动放弃业务）。
      进阶（了解即可，本项目不实现）：Redlock 拿多个独立 Redis 节点投票，业界对其安全性有争议。

# ── submission：提交即答辩（§11.1 承继 seckill-lab 的「做完之后三件套」）──
submission:
  template:
    require:
      - 改后的 LockServiceImpl（或你新建的实现类）关键实现（抢锁那一条命令 + 释放锁的 Lua 脚本）+ SeckillService 里的加锁顺序
      - 一句话解释你的锁如何防「误删」、如何防「持锁进程挂了导致死锁」
      - 实测证据：并发抢锁结果、TTL 到期释放、误删防护的前后对比
  # 锚点算法（admission._github_anchor，手写必错）：标题 strip → lower → **只保留 isalnum 或 " -_"**
  #   → 最后把空格换成连字符。
  # 本工单对应的章节标题原文（docs/数据库八股地图.md 第 99 行）：
  #   "## Stage 6（选修）· 死锁 & 分布式锁 ⬜"
  # 逐字推演：· 与 & 被丢弃、全角括号（选修）被丢弃、结尾的 ⬜ 被丢弃 → 尾部留下一个连字符；
  #   "stage 6（选修）· 死锁 & 分布式锁 ⬜" → "stage 6选修 死锁  分布式锁 " → 空格换连字符。
  # 候选名核对：若不要「选修」二字，标题会变成 "Stage 6 · 死锁 & 分布式锁 ⬜" → 锚点
  #   "stage-6--死锁--分布式锁-"（与 stage-01 同形）。但地图里的**实际标题带（选修）**，
  #   锚点必须匹配实际标题，所以正确取值是下面这个。改地图标题就要重算。
  bagu_map_ref: "docs/数据库八股地图.md#stage-6选修-死锁--分布式锁-"

# ── mentor_policy：导师权限（§6.4）。D1 角色反转的硬约束 ──
mentor_policy:
  mode: mentor_then_reveal           # 陪练期只给思路不代写；**过关后**才对照 solutions 分支的参考解（§8）
  may_write: []                      # 导师在本仓无可写文件；绝不碰 scope.files_to_change（D1，准入门硬卡）

# ── progression：解锁依赖（v0.3 反转——声明「我依赖谁」而非「我解锁谁」，整体构成 DAG，§9.2）──
progression:
  # 依赖 Stage 5（缓存三件套）的工单 id。本阶段是**选修加餐**：列在这里只表示"排在 Stage 5 之后、
  # 通过 db-stage-05 后变为 available"，不代表主线必须走它——不过它也不影响任何后续解锁
  # （本阶段已是 DAG 末端，没有别的工单依赖 db-stage-06）。
  prerequisites: ["db-stage-05"]
