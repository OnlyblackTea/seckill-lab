# ticket.yaml —— Stage 3 工单的**机器可读权威契约**。
#
# 契约来源（不是本仓自创的格式）：
#   schema : bagu-trainer/content/schema/ticket.schema.json（设计 §4.3）
#   模型   : bagu-trainer/platform_service/models.py::TicketSpec
#   准入门 : bagu-trainer/platform_service/admission.py::validate_track
#            （硬门校验：schema 合法、scope.files_to_change 在骨架里真的存在、
#              submission.bagu_map_ref 的锚点在 bagu_map 里能解析、
#              D1 —— mentor_policy.may_write 绝不与 scope.files_to_change 相交）
#
# 八个 concern 各管一件事：identity / brief / scope / grader / hints / submission /
# mentor_policy / progression。平台的 AI 经理只拿这份文件发卷，所以 brief.problem 必须自足。
#
# 学习者读的叙述版（线上问题的故事、「关键思考」）在
#   TASKS/stage-03-oversell-and-lock.md
# 两者冲突时**以本文件为准**；改了判据/题面要 bump identity.ticket_version。

# ── identity：身份 + 版本锚点 ──
identity:
  id: db-stage-03
  schema_version: 1
  ticket_version: 1
  stage: 3
  title: 高并发超卖了！

# ── brief：题面（自足，AI 经理据此发卷）──
brief:
  problem: |
    【线上问题｜来自：交易组 · 优先级 P0】
    秒杀开场，100 个请求同时打一个库存只有 10 的热点商品，结果卖出去 30 多件，
    库存账面上却还剩 9。用户付了钱货发不出去。根因是"丢失更新"（lost update）：
    库存被"读出来 → 应用里减一 → 写回去"，两个并发请求可能都读到 10，各自写回 9。

    这不是编的——骨架的 SeckillService.placeOrder() 就是故意这么写的：
      Integer stock = productMapper.selectStock(productId);   // ① 读
      if (stock == null || stock <= 0) { return 售罄; }        // ② 应用层判断
      productMapper.updateStock(productId, stock - 1);         // ③ 写回
    ① 与 ③ 之间没有任何互斥，"读-判断-写"不是一个原子操作。

    【你要做什么｜正好改两个文件（就是 scope.files_to_change 那两个）】
    1) src/main/java/com/devteam/seckill/service/SeckillService.java
       把 ①②③ 换成"原子扣减"：
         - 【推荐】把判断塞进 WHERE，用一条 SQL 同时完成判断与扣减：
             UPDATE product SET stock = stock - 1 WHERE id = #{id} AND stock > 0
           返回受影响行数：1=扣减成功，0=售罄。无需显式加锁。
         - 【也可以】悲观锁：SELECT ... FOR UPDATE 锁行后再读改写
           （注意必须处在 Stage 2 的事务里，否则语句结束锁就释放了，等于没锁）。
         - 【也可以】乐观锁：product 表有 version 字段，用 CAS 更新 + service 层重试。
       售罄仍返回 SeckillResult.soldOut(...)（success=false），不要抛异常到接口层。
    2) src/main/resources/mapper/ProductMapper.xml
       补全 decrementStock 对应的 SQL（现在是 TODO 占位，未绑定 → 调用抛 BindingException）。
       若你选悲观锁路线，也可以补一条带 FOR UPDATE 的查询，但 decrementStock 必须被绑定。

    注意：必须保持"先扣库存、再建订单"的顺序，且整个下单流程仍在 Stage 2 的事务边界内
    （Stage 2 的判据不能被这次改动破坏）。

  concepts: [行锁, 丢失更新, 乐观锁, 悲观锁, 当前读, 原子更新, 零超卖]

# ── scope：限定改动面（驱动评审与越界检测）。D1：导师绝不写这两个文件 ──
scope:
  files_to_change:
    - src/main/java/com/devteam/seckill/service/SeckillService.java
    - src/main/resources/mapper/ProductMapper.xml

# ── grader：客观红绿判据，在学员设备上本地跑；其结果按「不可信证据」处理（§7.4）──
grader:
  correctness:
    test_group: stage03              # 运行：mvn test -Dgroups=stage03
    test_version: 1
    canonical_test: src/test/java/com/devteam/seckill/stage03/OversellPreventionAcceptanceTest.java
    expect: |-
      初始为【红】（骨架：先读后写 → 丢失更新）：
        库存 10 的商品，30 个并发线程（每线程一个不同用户）同时下单。
        骨架下会出现"成功数 > 10"，或"成功数 = 10 但最终库存 < 0 / 与订单数对不上"，
        于是三条守恒断言至少一条失败 → 用例红。
      改对后为【绿】：
        ① 成功下单数 == 初始库存（10）——既不能超卖，也不能把正常请求误拒；
        ② 最终库存 == 0——不能是负数，也不能有剩余（有剩余说明锁粒度/重试把请求误杀了）；
        ③ 落库订单数 == 成功数——扣减与订单必须一一对应。
      注：若实现里把售罄写成抛异常并让测试直接 error，那也属于"红"，但不是我们要的绿——
      请把售罄作为业务结果返回（success=false + reason=SOLD_OUT:...）。
  performance:
    type: explain
    assert: "null"                   # 本阶段不是索引问题，无 EXPLAIN 判据
  concurrency:                       # Stage 3 独有（设计 §7.5：并发测试在学员真机上跑）
    type: oversell_sim               # 100 线程打 HTTP 接口，见 SeckillLoadSimulator
    test_group: sim                  # 运行：mvn test -Dgroups=sim -Dtest.excludedGroups=
    assert: "success_count <= initial_stock && final_stock == initial_stock - success_count && orders == success_count"
    note: |-
      sim 用 100 个线程打 POST /seckill（库存 10 的 fixture 商品）：
        成功(200) + 售罄(410) + 重复(409) + 未实现(501) + 其它 == 100；
        其它 == 0（不允许出现 500/超时等非预期结果）；
        成功数 <= 10，且最终库存 == 10 - 成功数，落库订单数 == 成功数。
      零超卖是硬指标；501 的存在说明 Stage 2/3 还没做完。

# ── hints：阶梯式提示，默认折叠；展开一条会计入学习者画像（§10）──
hints:
  - id: H1
    text: "别在 Java 里判断库存：把 `stock > 0` 这个条件挪进 SQL 的 WHERE，让数据库在同一条语句里完成判断与扣减。"
  - id: H2
    text: "为什么一条 UPDATE 就能免疫并发？想想 InnoDB 执行 UPDATE 时对行做了什么（加锁），以及 WHERE 是基于哪个版本求值的（最新已提交版本 = 当前读，而不是快照读）。"
  - id: H3
    text: |-
      想手动复现超卖？先跑这个看骨架怎么卖超的：
        mvn test -Dgroups=stage03
      再开两个 MySQL 会话手工打时间差：
        docker compose -f docker/docker-compose.yml exec mysql mysql -uroot -pbagu1234 seckill_lab
        -- 会话1： START TRANSACTION; SELECT stock FROM product WHERE id=1;   -- 读到 10
        -- 会话2： START TRANSACTION; SELECT stock FROM product WHERE id=1;   -- 也读到 10
        -- 会话1： UPDATE product SET stock = 10 - 1 WHERE id=1; COMMIT;
        -- 会话2： UPDATE product SET stock = 10 - 1 WHERE id=1; COMMIT;      -- 覆盖回 9 => 丢了一件
  - id: H4
    text: |-
      两种主流解法：
        * 原子更新（推荐）：UPDATE ... SET stock = stock - 1 WHERE id = ? AND stock > 0，
          判 affectedRows：0 就是售罄。不需要显式锁，也没有重试。
        * 悲观锁：SELECT ... FOR UPDATE 锁行 → 读 → 判断 → 写。
          【前提】必须在事务里（Stage 2 的 @Transactional），否则语句一结束锁就放了，等于没锁。
        * 乐观锁：version 字段做 CAS，更新 0 行就重试；写冲突多时重试会很频繁，秒杀场景通常不划算。
      自检：你的实现里，"读库存"和"改库存"之间还剩下任何一个可以被其它线程插进来的时间窗口吗？

# ── submission：提交即答辩（§11.1）──
submission:
  template:
    require:
      - 改后的 seckill()/placeOrder() 与扣减 SQL（或 FOR UPDATE 查询）
      - 一句话解释为什么你的方案在并发下不会超卖（选了原子更新/悲观锁/乐观锁，为什么）
      - 并发实测证据：初始库存 → 成功数 → 最终库存 → 落库订单数（改前 vs 改后）
  # 锚点算法：取地图标题原文 "Stage 3 · 锁 & 超卖 ⬜"，去掉 · 与 & 与 emoji，空格转 -，
  # 末尾残留一个连字符 => stage-3--锁--超卖-
  bagu_map_ref: "docs/数据库八股地图.md#stage-3--锁--超卖-"

# ── mentor_policy：导师权限（§6.4）。D1 角色反转的硬约束 ──
mentor_policy:
  mode: mentor_then_reveal           # 陪练期只给思路不代写；过关后才对照 solutions 分支参考解（§8）
  may_write: []                      # 导师在本仓无可写文件；绝不碰 scope.files_to_change（D1，准入门硬卡）

# ── progression：解锁依赖（声明「我依赖谁」，整体构成 DAG，§9.2）──
progression:
  prerequisites: ["db-stage-02"]
